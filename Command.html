<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>KR-Intelligence v3.2 – Global Command Center</title>
<style>
:root{--bg:#000;--fg:#f8f8f8;--muted:#aaa;--panel:#0b0b0b;--line:#242424;--accent:#78d8cc;--warn:#ffcf5a;--bad:#ff6b6b;--good:#68d391}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Arial,sans-serif}
body{min-height:100vh}
main{max-width:1180px;margin:0 auto;padding:34px 34px 46px}
h1{font-size:clamp(34px,4.2vw,54px);line-height:1.08;letter-spacing:-.045em;margin:0 0 32px;font-weight:760;max-width:920px}
.title-line{display:block}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:26px;row-gap:30px}
.card{min-width:0;position:relative}
.card button{all:unset;display:block;width:100%;cursor:pointer}
.card img{display:block;width:100%;aspect-ratio:1.62/1;object-fit:cover;border-radius:28px;background:#0b0b0b}
.card h2{font-size:clamp(22px,2.7vw,38px);line-height:1.05;letter-spacing:-.04em;margin:17px 0 8px;font-weight:760}
.card p{font-size:clamp(16px,2.05vw,27px);line-height:1.3;color:#aaa;margin:0;max-width:96%}
.card button:active img{transform:scale(.995);filter:brightness(.92)}
.live-dot{position:absolute;top:12px;right:12px;background:rgba(0,0,0,.72);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(8px);font-size:10px;letter-spacing:.09em;font-weight:800;padding:6px 8px;border-radius:999px;color:#cfeeea}
.live-dot::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--good);margin-right:5px;vertical-align:1px}
.dialog{position:fixed;inset:0;background:rgba(0,0,0,.84);backdrop-filter:blur(14px);display:none;align-items:flex-end;z-index:50}
.dialog.open{display:flex}
.sheet{width:100%;max-width:930px;margin:0 auto;background:#090909;border:1px solid #222;border-radius:28px 28px 0 0;padding:20px 18px calc(26px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;box-shadow:0 -20px 70px rgba(0,0,0,.55)}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;position:sticky;top:-20px;background:linear-gradient(#090909 82%,rgba(9,9,9,0));padding:20px 0 16px;z-index:2}
.sheet h3{font-size:28px;line-height:1.06;letter-spacing:-.03em;margin:0 0 7px}
.sheet .sub{color:#aaa;font-size:15px;line-height:1.4;margin:0}
.close{border:0;background:#1b1b1d;color:#fff;width:39px;height:39px;border-radius:50%;font-size:23px;cursor:pointer;flex:0 0 auto}
.statusbar{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 16px}
.pill{font-size:11px;letter-spacing:.05em;text-transform:uppercase;border:1px solid #2c2c2c;background:#111;padding:7px 9px;border-radius:999px;color:#aaa}
.pill.live{color:#a8eee4;border-color:#23443f;background:#0d1917}
.panel{background:#111;border:1px solid #282828;border-radius:18px;padding:15px;margin:12px 0}
.panel h4{font-size:16px;margin:0 0 10px;letter-spacing:-.01em}
.panel p{font-size:14px;line-height:1.45;color:#aaa;margin:0}
.metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.metric{background:#111;border:1px solid #282828;border-radius:16px;padding:13px}
.metric b{display:block;font-size:21px;margin-bottom:4px}
.metric span{font-size:12px;color:#999}
.feed{display:grid;gap:8px}
.feed-item{background:#111;border:1px solid #282828;border-radius:14px;padding:12px}
.feed-item a{color:#fff;text-decoration:none;font-weight:650;line-height:1.3}
.feed-item small{display:block;color:#888;margin-top:6px;line-height:1.35}
.weather-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.weather-card{background:#111;border:1px solid #282828;border-radius:15px;padding:12px}
.weather-card strong{display:block;font-size:15px;margin-bottom:4px}
.weather-card b{font-size:20px}
.weather-card span{font-size:12px;color:#999;margin-left:5px}
.links{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:16px}
.links a{display:block;color:#fff;text-decoration:none;background:#141414;border:1px solid #2d2d2d;border-radius:14px;padding:14px;font-weight:650}
.links small{display:block;color:var(--accent);margin-top:4px;font-weight:500}
.note{margin-top:14px;padding:12px 13px;border-radius:13px;background:#0d1414;color:#a9c7c2;font-size:12px;line-height:1.45;border:1px solid #1c2d2b}
.refresh{border:1px solid #2b2b2b;background:#151515;color:#fff;border-radius:12px;padding:10px 12px;font-weight:650;cursor:pointer;margin:2px 0 8px}
.refresh:disabled{opacity:.5}
.tvwrap{border:1px solid #282828;border-radius:16px;overflow:hidden;background:#080808}
.tvwrap iframe{display:block;width:100%;height:360px;border:0;background:#080808}
.error{color:#ffb7b7}
.synthesis{font-size:15px;line-height:1.5;color:#ddd}
.score{font-size:34px;font-weight:780;letter-spacing:-.04em}
.score.low{color:#79d7b3} .score.medium{color:#ffd36a} .score.high{color:#ff7b7b}
@media(max-width:600px){
main{padding:24px 16px 38px}
h1{font-size:22px;line-height:1.15;margin-bottom:24px;letter-spacing:-.045em}
.title-line{display:block;white-space:nowrap}
.grid{column-gap:12px;row-gap:24px}
.card img{border-radius:20px}
.card h2{font-size:18px;line-height:1.08;margin-top:13px;margin-bottom:7px}
.card p{font-size:14px;line-height:1.34;max-width:100%}
.links{grid-template-columns:1fr}
}
@media(max-width:420px){
main{padding-left:14px;padding-right:14px}
h1{font-size:21px;line-height:1.14}
.grid{column-gap:12px;row-gap:23px}
.card h2{font-size:17px}
.card p{font-size:13.5px;line-height:1.36}
.card img{border-radius:18px}
.sheet h3{font-size:24px}
}
</style>
</head>
<body>
<main>
  <h1><span class="title-line">KR-Intelligence v3.2 – Global</span><span class="title-line">Command Center</span></h1>
  <section class="grid" id="grid"></section>
</main>

<div class="dialog" id="dialog" role="dialog" aria-modal="true" aria-hidden="true">
  <div class="sheet">
    <div class="sheet-head">
      <div>
        <h3 id="dialogTitle"></h3>
        <p class="sub" id="dialogDesc"></p>
      </div>
      <button class="close" id="close" aria-label="Stäng">×</button>
    </div>
    <div class="statusbar">
      <span class="pill live">Livepanel</span>
      <span class="pill" id="freshness">Data laddas…</span>
      <span class="pill">0 publika AI-anrop</span>
    </div>
    <div id="content"></div>
    <div class="links" id="links"></div>
    <div class="note">KR-Intelligence visar öppna eller externt inbäddade datakällor. Uppgifter kan vara fördröjda eller ofullständiga. AI-lagret är inte kopplat till publika användarklick.</div>
  </div>
</div>

const grid=document.getElementById('grid');
const dialog=document.getElementById('dialog');
const title=document.getElementById('dialogTitle');
const desc=document.getElementById('dialogDesc');
const links=document.getElementById('links');
const content=document.getElementById('content');
const freshness=document.getElementById('freshness');

const state={quakes:null,eonet:null,weather:null,geo:null,cyber:null,loadedAt:null};
const CACHE_KEY='krintel_v32_cache';
const CACHE_MS=15*60*1000;

function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function ago(ts){
  if(!ts)return '';
  const m=Math.max(0,Math.round((Date.now()-ts)/60000));
  return m<1?'nyss':m===1?'1 min sedan':m+' min sedan';
}
function withTimeout(url,ms=9000){
  const c=new AbortController(); const t=setTimeout(()=>c.abort(),ms);
  return fetch(url,{signal:c.signal,headers:{'Accept':'application/json'}}).finally(()=>clearTimeout(t));
}
function saveCache(){
  try{localStorage.setItem(CACHE_KEY,JSON.stringify({t:Date.now(),data:state}));}catch(e){}
}
function loadCache(){
  try{
    const x=JSON.parse(localStorage.getItem(CACHE_KEY)||'null');
    if(x && Date.now()-x.t<CACHE_MS){Object.assign(state,x.data);return true;}
  }catch(e){}
  return false;
}

async function fetchQuakes(){
  const r=await withTimeout('https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/4.5_day.geojson');
  if(!r.ok)throw new Error('USGS '+r.status);
  const j=await r.json();
  state.quakes=(j.features||[]).slice(0,12).map(f=>({
    mag:f.properties?.mag,place:f.properties?.place,time:f.properties?.time,url:f.properties?.url
  }));
}
async function fetchEonet(){
  const r=await withTimeout('https://eonet.gsfc.nasa.gov/api/v3/events?status=open&limit=12');
  if(!r.ok)throw new Error('NASA '+r.status);
  const j=await r.json();
  state.eonet=(j.events||[]).slice(0,12).map(e=>({
    title:e.title,cats:(e.categories||[]).map(x=>x.title).join(', '),
    date:e.geometry?.at(-1)?.date||'',url:e.sources?.[0]?.url||e.link
  }));
}
async function fetchWeather(){
  const url='https://api.open-meteo.com/v1/forecast?latitude=59.3293,50.4501,31.7683,25.2048&longitude=18.0686,30.5234,35.2137,55.2708&current=temperature_2m,wind_speed_10m,weather_code&timezone=UTC';
  const r=await withTimeout(url);
  if(!r.ok)throw new Error('Open-Meteo '+r.status);
  const j=await r.json();
  const arr=Array.isArray(j)?j:[j];
  const names=['Stockholm','Kyiv','Jerusalem','Dubai'];
  state.weather=arr.map((x,i)=>({
    name:names[i]||'Plats '+(i+1),
    temp:x.current?.temperature_2m,
    wind:x.current?.wind_speed_10m,
    code:x.current?.weather_code
  }));
}
async function fetchGdelt(query,key){
  const u='https://api.gdeltproject.org/api/v2/doc/doc?query='+encodeURIComponent(query)+'&mode=artlist&maxrecords=8&format=json&sort=HybridRel';
  const r=await withTimeout(u,10000);
  if(!r.ok)throw new Error('GDELT '+r.status);
  const j=await r.json();
  state[key]=(j.articles||[]).slice(0,8).map(a=>({
    title:a.title,url:a.url,source:a.domain||a.sourcecountry||'',date:a.seendate||''
  }));
}

async function refreshAll(force=false){
  if(!force && loadCache())return;
  const jobs=[
    fetchQuakes(),
    fetchEonet(),
    fetchWeather(),
    fetchGdelt('(conflict OR war OR sanctions OR military OR ceasefire)','geo'),
    fetchGdelt('(cybersecurity OR ransomware OR vulnerability OR cyberattack)','cyber')
  ];
  await Promise.allSettled(jobs);
  state.loadedAt=Date.now();
  saveCache();
}
refreshAll(false);

function sourceLinks(s){
  links.innerHTML='';
  s.sources.forEach(([name,url])=>{
    const a=document.createElement('a');a.href=url;a.target='_blank';a.rel='noopener noreferrer';
    a.innerHTML=esc(name)+'<small>Öppna källa ↗</small>';links.appendChild(a);
  });
}
function feedHtml(items,empty){
  if(!items||!items.length)return '<div class="panel"><p class="error">'+esc(empty)+'</p></div>';
  return '<div class="feed">'+items.map(x=>'<div class="feed-item"><a target="_blank" rel="noopener noreferrer" href="'+esc(x.url||'#')+'">'+esc(x.title||'Händelse')+'</a><small>'+esc([x.source,x.date].filter(Boolean).join(' · '))+'</small></div>').join('')+'</div>';
}
function weatherHtml(){
  if(!state.weather||!state.weather.length)return '<div class="panel"><p class="error">Väderdata kunde inte hämtas just nu.</p></div>';
  return '<div class="weather-grid">'+state.weather.map(x=>'<div class="weather-card"><strong>'+esc(x.name)+'</strong><b>'+esc(x.temp)+'°</b><span>'+esc(x.wind)+' km/h vind</span></div>').join('')+'</div>';
}
function quakesHtml(){
  if(!state.quakes||!state.quakes.length)return '<div class="panel"><p class="error">USGS-data kunde inte hämtas just nu.</p></div>';
  return '<div class="feed">'+state.quakes.slice(0,6).map(q=>'<div class="feed-item"><a target="_blank" rel="noopener noreferrer" href="'+esc(q.url||'#')+'">M '+esc(q.mag)+' · '+esc(q.place)+'</a><small>'+esc(new Date(q.time).toLocaleString('sv-SE'))+'</small></div>').join('')+'</div>';
}
function eonetHtml(){
  if(!state.eonet||!state.eonet.length)return '<div class="panel"><p class="error">NASA EONET-data kunde inte hämtas just nu.</p></div>';
  return '<div class="feed">'+state.eonet.slice(0,6).map(e=>'<div class="feed-item"><a target="_blank" rel="noopener noreferrer" href="'+esc(e.url||'#')+'">'+esc(e.title)+'</a><small>'+esc(e.cats)+'</small></div>').join('')+'</div>';
}
function synthesis(){
  const q=state.quakes||[], e=state.eonet||[], g=state.geo||[], c=state.cyber||[];
  const strong=q.filter(x=>Number(x.mag)>=6).length;
  let score=Math.min(100,strong*18+Math.min(q.length,10)*2+Math.min(e.length,10)*2+Math.min(g.length,8)*2+Math.min(c.length,8)*2);
  let level=score>=60?'Hög':score>=30?'Förhöjd':'Låg';
  let cls=score>=60?'high':score>=30?'medium':'low';
  return {score,level,cls,strong};
}
function financeHtml(){
  return `<div class="panel"><h4>Global marknadsöversikt</h4><p>Den publika versionen använder ingen dold API-nyckel. Marknadsdata visas via extern TradingView-vy; egna kostnadsbelagda API-anrop är inte aktiverade.</p></div>
  <div class="tvwrap"><iframe loading="lazy" src="https://s.tradingview.com/widgetembed/?symbol=NASDAQ%3ANDX&interval=D&hidesidetoolbar=1&symboledit=1&saveimage=0&toolbarbg=000000&studies=%5B%5D&theme=dark&style=1&timezone=Etc%2FUTC&withdateranges=1&hideideas=1&locale=en" title="TradingView Nasdaq-100"></iframe></div>`;
}
function render(s){
  freshness.textContent=state.loadedAt?'Uppdaterad '+ago(state.loadedAt):'Data laddas…';
  if(s.id==='geo'){
    content.innerHTML='<div class="panel"><h4>Aktuellt globalt nyhetsflöde</h4><p>GDELT-sökning på konflikter, krig, sanktioner, militär aktivitet och vapenvilor. Resultaten är källmaterial, inte verifierade slutsatser.</p></div>'+feedHtml(state.geo,'GDELT-flödet kunde inte hämtas från webbläsaren. Använd källknapparna nedan.');
  } else if(s.id==='finance'){
    content.innerHTML=financeHtml();
  } else if(s.id==='flight'){
    content.innerHTML='<div class="panel"><h4>Spårningsläge</h4><p>Flyg- och fartygslivepositioner öppnas via specialiserade källor. OpenSky kräver numera autentiserad API-åtkomst för programmatisk användning, därför ligger inga hemliga nycklar i den publika sidan.</p></div><div class="metrics"><div class="metric"><b>ADS-B</b><span>Livekälla externt</span></div><div class="metric"><b>AIS</b><span>Sjöfart externt</span></div></div>';
  } else if(s.id==='weather'){
    content.innerHTML='<div class="panel"><h4>Aktuellt väder</h4><p>Fyra globala referenspunkter via Open-Meteo.</p></div>'+weatherHtml()+'<div class="panel"><h4>Aktiva naturhändelser · NASA EONET</h4></div>'+eonetHtml()+'<div class="panel"><h4>Jordbävningar M4.5+ · senaste dygnet</h4></div>'+quakesHtml();
  } else if(s.id==='cyber'){
    content.innerHTML='<div class="panel"><h4>Cyberlägesbild</h4><p>Öppet nyhetsflöde via GDELT kompletterat med defensiva källor som CISA, Cloudflare Radar och VirusTotal.</p></div>'+feedHtml(state.cyber,'Cyberflödet kunde inte hämtas från webbläsaren. Använd källknapparna nedan.');
  } else if(s.id==='ai'){
    const a=synthesis();
    content.innerHTML='<div class="panel"><h4>Automatisk systemsyntes</h4><div class="score '+a.cls+'">'+a.level+' · '+a.score+'/100</div><p class="synthesis">Detta är en lokal, regelbaserad sammanställning av tillgängliga liveflöden — inte ett betalt AI-anrop och inte en prognos med garanterad träffsäkerhet.</p></div><div class="metrics"><div class="metric"><b>'+((state.quakes||[]).length)+'</b><span>M4.5+ jordbävningar / dygn</span></div><div class="metric"><b>'+((state.eonet||[]).length)+'</b><span>aktiva EONET-händelser i urval</span></div><div class="metric"><b>'+((state.geo||[]).length)+'</b><span>geopolitiska artiklar i urval</span></div><div class="metric"><b>'+((state.cyber||[]).length)+'</b><span>cyberartiklar i urval</span></div></div>';
  }
}
async function openSector(i){
  const s=sectors[i]; title.textContent=s.title; desc.textContent=s.desc; sourceLinks(s);
  content.innerHTML='<div class="panel"><p>Hämtar aktuell data…</p></div>';
  dialog.classList.add('open');dialog.setAttribute('aria-hidden','false');document.body.style.overflow='hidden';
  await refreshAll(false); render(s);
}
function closeDialog(){dialog.classList.remove('open');dialog.setAttribute('aria-hidden','true');document.body.style.overflow='';}
sectors.forEach((s,i)=>{
  const article=document.createElement('article');article.className='card';
  const btn=document.createElement('button');btn.setAttribute('aria-label','Öppna '+s.title);
  btn.innerHTML='<span class="live-dot">LIVE</span><img src="'+s.img+'" alt=""><h2>'+esc(s.title)+'</h2><p>'+esc(s.desc)+'</p>';
  btn.addEventListener('click',()=>openSector(i)); article.appendChild(btn); grid.appendChild(article);
});
document.getElementById('close').addEventListener('click',closeDialog);
dialog.addEventListener('click',e=>{if(e.target===dialog)closeDialog();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDialog();});
</script>
</body>
</html>
